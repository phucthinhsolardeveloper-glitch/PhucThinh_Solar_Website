ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Chỉ tin proxy ở mạng Docker nội bộ. REMOTE_ADDR vì vậy là IP khách thật,
# giúp rate limit/lockout Admin không gom mọi người thành IP container Caddy.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Defense in depth: upload là dữ liệu tĩnh, không bao giờ được thực thi script.
<Directory /var/www/html/upload>
    php_admin_flag engine off
    Options -Indexes
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar|cgi|pl|asp|aspx|jsp|shtml|inc)$">
        Require all denied
    </FilesMatch>
</Directory>
