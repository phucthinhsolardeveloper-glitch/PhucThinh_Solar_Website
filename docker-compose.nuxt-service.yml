# Staging/local rehearsal of the Nuxt SSR service as a standalone container
# (not `npm run dev`). Isolated network + port; does not touch Caddy, DNS,
# or any production container. No public route flag is turned on here beyond
# what the operator explicitly sets in the environment below (defaults stay
# OFF, matching frontend/nuxt.config.ts).
#
# Run:   docker compose -f docker-compose.nuxt-service.yml up -d --build
# Logs:  docker compose -f docker-compose.nuxt-service.yml logs -f
# Stop:  docker compose -f docker-compose.nuxt-service.yml down
# Rollback: the command above (`down`) - no PHP/production state is touched.
services:
  nuxt-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pts-nuxt-service-rehearsal
    restart: "no"
    environment:
      NUXT_PHP_ORIGIN: ${NUXT_PHP_ORIGIN:-http://php-upstream:80}
      # Comma-separated exact host[:port] entries only - never a wildcard.
      NUXT_PHP_ORIGIN_ALLOWLIST: ${NUXT_PHP_ORIGIN_ALLOWLIST:-php-upstream:80}
      NUXT_PREVIEW_MEDIA_PROXY: ${NUXT_PREVIEW_MEDIA_PROXY:-false}
      NUXT_PUBLIC_PHP_PUBLIC_ORIGIN: ${NUXT_PUBLIC_PHP_PUBLIC_ORIGIN:-http://php-upstream:80}
      # Flags stay OFF unless the operator running this rehearsal overrides
      # them in the environment - never bake a true default into the image.
      NUXT_PUBLIC_ABOUT_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_ABOUT_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_ABOUT_PUBLIC_ROUTE_INDEXABLE: ${NUXT_PUBLIC_ABOUT_PUBLIC_ROUTE_INDEXABLE:-false}
      NUXT_PUBLIC_SOLUTIONS_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_SOLUTIONS_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_SOLUTIONS_PUBLIC_ROUTE_INDEXABLE: ${NUXT_PUBLIC_SOLUTIONS_PUBLIC_ROUTE_INDEXABLE:-false}
    ports:
      - "127.0.0.1:3101:3000"
    networks: [nuxt-service-rehearsal]
networks:
  nuxt-service-rehearsal:
    name: pts-nuxt-service-rehearsal-net
    driver: bridge
