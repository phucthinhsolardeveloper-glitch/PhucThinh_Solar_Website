# Staging/local rehearsal of the Nuxt SSR service as a standalone container
# (not `npm run dev`). Isolated network + port; does not touch Caddy, DNS,
# or any production container. No public route flag is turned on here beyond
# what the operator explicitly sets in the environment below (defaults stay
# OFF, matching frontend/nuxt.config.ts).
#
# Run:   docker compose -f docker-compose.nuxt-service.yml up -d --build
# Logs:  docker compose -f docker-compose.nuxt-service.yml logs -f
# Stop:  docker compose -f docker-compose.nuxt-service.yml down
# Rollback: the command above (`down`) - no PHP/production state is touched.
services:
  nuxt-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pts-nuxt-service-rehearsal
    restart: "no"
    environment:
      NUXT_PHP_ORIGIN: ${NUXT_PHP_ORIGIN:-http://pts-php81-local:80}
      # Comma-separated exact host[:port] entries only - never a wildcard.
      NUXT_PHP_ORIGIN_ALLOWLIST: ${NUXT_PHP_ORIGIN_ALLOWLIST:-pts-php81-local:80,host.docker.internal:8080,127.0.0.1:8080}
      NUXT_PREVIEW_MEDIA_PROXY: ${NUXT_PREVIEW_MEDIA_PROXY:-false}
      NUXT_PUBLIC_PHP_PUBLIC_ORIGIN: ${NUXT_PUBLIC_PHP_PUBLIC_ORIGIN:-http://localhost:8080}
      # Flags stay OFF unless the operator running this rehearsal overrides
      # them in the environment - never bake a true default into the image.
      NUXT_PUBLIC_HOME_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_HOME_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_ABOUT_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_ABOUT_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_SOLUTIONS_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_SOLUTIONS_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_SOLUTION_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_SOLUTION_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_PROJECTS_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_PROJECTS_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_PROJECT_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_PROJECT_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_NEWS_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_NEWS_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_NEWS_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_NEWS_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_CONTACT_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_CONTACT_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_DEALER_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_DEALER_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_CATALOG_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_CATALOG_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_PRODUCT_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_PRODUCT_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_BRAND_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_BRAND_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_SEARCH_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_SEARCH_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_GALLERY_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_GALLERY_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_GALLERY_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_GALLERY_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_VIDEO_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_VIDEO_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_POLICY_DETAIL_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_POLICY_DETAIL_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_CART_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_CART_PUBLIC_ROUTE_ENABLED:-false}
      NUXT_PUBLIC_ORDER_SUCCESS_PUBLIC_ROUTE_ENABLED: ${NUXT_PUBLIC_ORDER_SUCCESS_PUBLIC_ROUTE_ENABLED:-false}
    ports:
      - "127.0.0.1:3101:3000"
    networks:
      - nuxt-service-rehearsal
      - web_pts_php_default
networks:
  nuxt-service-rehearsal:
    name: pts-nuxt-service-rehearsal-net
    driver: bridge
  web_pts_php_default:
    external: true
