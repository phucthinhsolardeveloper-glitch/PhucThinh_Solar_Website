# Local Laravel 13 backend for the migration branch only. Runs beside the legacy stack and never replaces it.
# Up:   docker compose -f docker-compose.laravel.yml up -d --build
# Down: docker compose -f docker-compose.laravel.yml down
# It reaches MariaDB through the legacy local network and uses only the pts_laravel13_clone database.
services:
  laravel13:
    build:
      context: ./backend/docker
    container_name: pts-laravel13-local
    restart: "no"
    working_dir: /app
    environment:
      # artisan serve answers several requests at once (Nuxt SSR fans out API calls).
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./backend:/app
      # The legacy PHP container's upload volume, read-only, so image resolution sees the same files as PHP.
      - legacy_upload:/legacy/upload:ro
      # Stock pictures and documents shipped with the PHP checkout.
      - ./domains/phucthinhsolar.com/public_html/assets:/legacy/assets:ro
    ports:
      - "127.0.0.1:8090:8000"
    networks:
      - web_pts_php_default
networks:
  web_pts_php_default:
    external: true
volumes:
  legacy_upload:
    external: true
    name: web_pts_php_pts_web_upload
