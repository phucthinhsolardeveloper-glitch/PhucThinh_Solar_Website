services:
  db-cart-test:
    image: mariadb:10.11
    container_name: pts-mariadb-cart-mutation-test
    restart: "no"
    environment:
      MARIADB_DATABASE: cart_mutation_test
      MARIADB_USER: cart_test
      MARIADB_PASSWORD: cart_test_only
      MARIADB_ROOT_PASSWORD: cart_test_root_only
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./tests-tmp/schema-only.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tests-tmp/fixture.sql:/docker-entrypoint-initdb.d/02-fixture.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcart_test_root_only"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [cart-mutation-test-net]

  web-cart-test:
    image: web_pts_php-web:latest
    container_name: pts-php81-cart-mutation-test
    restart: "no"
    environment:
      APP_ENV: local
      DB_HOST: db-cart-test
      DB_PORT: "3306"
      DB_NAME: cart_mutation_test
      DB_USER: cart_test
      DB_PASSWORD: cart_test_only
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8096:80"
    volumes:
      - ./domains/phucthinhsolar.com/public_html:/var/www/html:ro
    tmpfs:
      - /var/www/html/caches:mode=1777
      - /var/www/html/assets/caches:mode=1777
      - /var/www/html/logs:mode=1777
      - /var/www/html/thumbs:mode=1777
      - /var/www/html/upload:mode=1777
    depends_on:
      db-cart-test:
        condition: service_healthy
    networks: [cart-mutation-test-net]

networks:
  cart-mutation-test-net:
    name: pts-cart-mutation-test-net
