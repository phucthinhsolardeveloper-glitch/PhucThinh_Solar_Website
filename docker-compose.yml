# Môi trường local: MỘT container `pts-laravel13-local` chạy cả Laravel (API, media, Admin Filament) và MariaDB.
# Lên:  docker compose up -d --build
# Xuống: docker compose down        (KHÔNG thêm -v: volume pts_local_data là database local)
#
# MariaDB trong container chạy **UTC giống production** (--default-time-zone=+00:00 trong local-entrypoint.sh).
# Trước 2026-11-10 DB local chạy +07 nên mọi cột TIMESTAMP lệch production đúng 7 giờ. Đừng đổi lại múi giờ.
#
# Lần đầu (volume rỗng) entrypoint tạo user/database theo backend/.env và nạp /seed/local-dbs.sql nếu có.
# Nuxt không chạy trong container: xem scripts/README.md.
name: pts-local
services:
  laravel13:
    build:
      context: ./backend/docker
    container_name: pts-laravel13-local
    restart: "no"
    working_dir: /app
    environment:
      TZ: UTC
      # artisan serve answers several requests at once (Nuxt SSR fans out API calls).
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./backend:/app
      # Database local (MariaDB nằm trong cùng container).
      - pts_local_data:/var/lib/mysql
      # Uploaded media volume, read-only locally.
      - legacy_upload:/srv/upload:ro
      # Site pictures shipped with the storefront (checked and resized by Laravel, served by Nuxt).
      - ./frontend/public/assets:/srv/assets:ro
    ports:
      - "127.0.0.1:8090:8000"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  pts_local_data:
  legacy_upload:
    external: true
    name: web_pts_php_pts_web_upload
