name: Nuxt integration gates

on:
  push:
    branches:
      - feature/pts-nuxt-integration-20261027
  pull_request:
    paths:
      - '.github/workflows/nuxt-integration.yml'
      - '.nvmrc'
      - 'frontend/**'
      - 'scripts/nuxt-cutover-preflight.mjs'
      - 'scripts/tests/nuxt-cutover.test.mjs'
      - 'tools/visual-tests/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # low threshold was raised to moderate on 2026-10-28: GHSA-gcqx-w48m-w2h4
        # (deepmerge prototype pollution) now flags the entire >=4.2.0 range,
        # including the latest 4.3.1 - there is no patched version to pin to.
        # `npm audit fix --force` would downgrade nuxt to 4.1.3 (5 minor
        # versions back), which is out of scope as an unreviewed breaking
        # change. The affected code path is Nitro's internal build-time config
        # merging, not reachable from end-user request input. Re-tighten this
        # once deepmerge ships a fix.
        run: npm audit --omit=optional --audit-level=moderate

      - name: Contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: SSR smoke
        run: npm run smoke

      - name: Cutover static tests
        working-directory: .
        run: node --test scripts/tests/nuxt-cutover.test.mjs

      - name: Visual and SEO harness tests
        working-directory: tools/visual-tests
        run: node --test tests/migration-compare.test.cjs tests/migration-seo-audit.test.cjs
