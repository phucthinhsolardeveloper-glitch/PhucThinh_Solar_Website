# The local PHP container is a data/media bridge for Nuxt, not a PHP site preview.
# Keep API and uploaded media available while denying direct access to legacy pages.
<LocationMatch "^/(?!api(?:/|$)|upload(?:/|$))">
    Require all denied
</LocationMatch>

# upload/ is read-only here, so PHP warnings about creating its folders must stay in the log:
# printed into a response they break the JSON contract and every catalog route returns 502.
php_admin_flag display_errors off
