services:
  db:
    build:
      context: .
      dockerfile: docker/mariadb104/Dockerfile
    container_name: pts-mariadb-local
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: phucthinhs_local
      MARIADB_USER: pts_local
      MARIADB_PASSWORD: pts_local_only
      MARIADB_ROOT_PASSWORD: pts_root_local_only
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - pts_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppts_root_local_only"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/php74/Dockerfile
    container_name: pts-php74-local
    restart: unless-stopped
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: phucthinhs_local
      DB_USER: pts_local
      DB_PASSWORD: pts_local_only
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pts_mariadb_data:
