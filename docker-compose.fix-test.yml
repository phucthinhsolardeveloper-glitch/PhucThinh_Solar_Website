services:
  web:
    build:
      context: .
      dockerfile: docker/php81/Dockerfile
    container_name: pts-php81-fix-test
    environment:
      APP_ENV: local
      LOCAL_ENFORCE_RBAC: "0"
      DB_HOST: pts-mariadb-local
      DB_PORT: "3306"
      DB_NAME: phucthinhs_local
      DB_USER: pts_local
      DB_PASSWORD: pts_local_only
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8097:80"
    volumes:
      - ./domains/phucthinhsolar.com/public_html:/var/www/html
      - pts_fix_test_caches:/var/www/html/caches
      - pts_fix_test_logs:/var/www/html/logs
      - pts_fix_test_upload:/var/www/html/upload
      - pts_fix_test_thumbs:/var/www/html/thumbs
    networks:
      default:

networks:
  default:
    name: web_pts_php_default
    external: true

volumes:
  pts_fix_test_caches:
  pts_fix_test_logs:
  pts_fix_test_upload:
  pts_fix_test_thumbs:
