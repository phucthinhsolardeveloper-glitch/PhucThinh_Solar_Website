services:
  web-stage3:
    image: web_pts_php-web:latest
    container_name: pts-php81-stage3-qa
    restart: "no"
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: phucthinhs_local
      DB_USER: pts_local
      DB_PASSWORD: pts_local_only
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./domains/phucthinhsolar.com/public_html:/var/www/html:ro
      - local-uploads:/var/www/html/upload:ro
    tmpfs:
      - /var/www/html/caches:mode=1777
      - /var/www/html/assets/caches:mode=1777
      - /var/www/html/logs:mode=1777
      - /var/www/html/thumbs:mode=1777
    networks: [existing-pts-local]
networks:
  existing-pts-local:
    external: true
    name: web_pts_php_default
volumes:
  local-uploads:
    external: true
    name: web_pts_php_pts_web_upload
