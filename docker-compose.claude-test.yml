services:
  web:
    build:
      context: .
      dockerfile: docker/php81/Dockerfile
    container_name: pts-php81-claude-test
    restart: "no"
    environment:
      APP_ENV: local
      LOCAL_ENFORCE_RBAC: "0"
      DB_HOST: pts-mariadb-local
      DB_PORT: "3306"
      DB_NAME: phucthinhs_local
      DB_USER: pts_local
      DB_PASSWORD: pts_local_only
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8088:80"
    volumes:
      # Bind-mount sống bị lỗi "distro mount service" trên WSL distro này (Docker
      # Desktop WSL integration chưa bắt được) — bỏ bind-mount, dùng thẳng code đã
      # COPY vào image lúc build (Dockerfile COPY domains/.../public_html/). Muốn
      # cập nhật code thì build lại image (--build), không live-reload.
      - pts_claude_test_caches:/var/www/html/caches
      - pts_claude_test_logs:/var/www/html/logs
      # upload/thumbs dùng chung volume thật (chỉ đọc ảnh sản phẩm có sẵn,
      # không ghi gì mới) để ptsCatalogPublicMedia()/is_file() check đúng.
      - web_pts_php_pts_web_upload:/var/www/html/upload
      - web_pts_php_pts_web_thumbs:/var/www/html/thumbs
    networks:
      default:
        aliases: []

networks:
  default:
    name: web_pts_php_default
    external: true

volumes:
  pts_claude_test_caches:
  pts_claude_test_logs:
  web_pts_php_pts_web_upload:
    external: true
  web_pts_php_pts_web_thumbs:
    external: true
